name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Code and Build APK
        run: |
          mkdir -p app/src/main/java/com/example/expensetracker
          mkdir -p gradle/wrapper

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # 1. settings.gradle.kts
          echo "" | base64 -d > settings.gradle.kts

          # 2. build.gradle.kts (Root)
          echo "cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjIuMiIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMS45LjIyIiBhcHBseSBmYWxzZQogICAgaWQoIm9yZy5qZXRicmFpbnMua290bGluLmthcHQiKSB2ZXJzaW9uICIxLjkuMjIiIGFwcGx5IGZhbHNlCn0K" | base64 -d > build.gradle.kts

          # 3. app/build.gradle.kts
          echo "" | base64 -d > app/build.gradle.kts

          # 4. AndroidManifest.xml
          echo "" | base64 -d > app/src/main/AndroidManifest.xml

          # 5. AppDatabase.kt
          echo "" | base64 -d > app/src/main/java/com/example/expensetracker/AppDatabase.kt

          # 6. TransactionParser.kt
          echo "" | base64 -d > app/src/main/java/com/example/expensetracker/TransactionParser.kt

          # 7. NotificationService.kt
          echo "" | base64 -d > app/src/main/java/com/example/expensetracker/NotificationService.kt

          # 8. SmsReceiver.kt
          echo "" | base64 -d > app/src/main/java/com/example/expensetracker/SmsReceiver.kt

          # 9. MainActivity.kt
          echo "" | base64 -d > app/src/main/java/com/example/expensetracker/MainActivity.kt

          # 10. Download Gradle 8.4 and Build
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip
          export PATH=$PWD/gradle-8.4/bin:$PATH

          gradle wrapper
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
