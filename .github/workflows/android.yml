name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Project & Build
        run: |
          # 1. Download Gradle binary
          wget https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip
          export PATH=$PWD/gradle-8.4/bin:$PATH

          # 2. Find where settings.gradle / settings.gradle.kts actually lives
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle*" | head -n 1))
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: Could not find settings.gradle.kts anywhere in the repo!"
            ls -la
            exit 1
          fi

          echo "Found Gradle project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 3. Generate wrapper and assemble
          gradle wrapper
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
